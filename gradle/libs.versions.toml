[versions]
agp = "9.5.1"
appcompat = "1.8.0"
material = "1.14.0"
lifecycle = "2.11.0"
junit = "4.13.2"
pleosVehicle = "2.3.2"
pleosNaviHelper = "3.0.5"
pleosTextToSpeech = "3.3.1"
pleosFusedLocation = "1.1.3"

[libraries]
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-lifecycle-livedata = { module = "androidx.lifecycle:lifecycle-livedata", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel", version.ref = "lifecycle" }
material = { module = "com.google.android.material:material", version.ref = "material" }
junit = { module = "junit:junit", version.ref = "junit" }
pleos-vehicle = { module = "ai.pleos.playground:Vehicle", version.ref = "pleosVehicle" }
pleos-navihelper = { module = "ai.pleos.playground:NaviHelper", version.ref = "pleosNaviHelper" }
pleos-texttospeech = { module = "ai.pleos.playground:TextToSpeech", version.ref = "pleosTextToSpeech" }
pleos-fusedlocation = { module = "ai.pleos.playground:FusedLocation", version.ref = "pleosFusedLocation" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
